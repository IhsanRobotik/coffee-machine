
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Products</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        img {
            user-drag: none;
            -webkit-user-drag: none;
            pointer-events: auto;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            cursor: none !important;
        }

 :root {
            --bg-color: #f4f1eb;           /* Warm cream, like milk foam */
            --overlay-color: rgba(139, 115, 85, 0.15); /* Soft coffee overlay */
            --text-color: #3c2415;         /* Dark roasted coffee brown */
            --card-bg: #c08a55;           /* Light coffee with milk */
            --shadow-light: #cba57f;      /* Light coffee shadow */
            --shadow-dark: #4e362f;       /* Dark coffee shadow */
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --font-base: 'Roboto', sans-serif;
            --fs-xl: clamp(1.5rem, 5vw, 2.5rem);
            --fs-lg: clamp(1.25rem, 4vw, 2rem);
            --fs-md: 1rem;
            --line-height: 1.6;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-base);
            font-size: var(--fs-md);
            line-height: var(--line-height);
            color: var(--text-color);
            background: linear-gradient(135deg, #2c1810 0%, #8b4513 100%) center/cover no-repeat;
            overflow: hidden;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('../images/wallpaper.jpg');
            background-size: cover;
            filter: blur(3px);
            z-index: -1;
        }

        h1 {
            font-size: var(--fs-xl);
            text-align: center;
            text-shadow: 1px 1px 4px var(--shadow-dark);
        }

        .coffee-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
        }

        .coffee-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: var(--space-md);
            /* box-shadow:
                inset 4px 4px 8px var(--shadow-light),
                4px 4px 8px var(--shadow-dark);
            transition: transform 0.2s ease, box-shadow 0.2s ease; */
            display: flex;
            flex-direction: column;
        }

        .coffee-item:hover {
            transform: translateY(-4px);
            box-shadow:
                inset 2px 2px 4px var(--shadow-light),
                8px 8px 16px var(--shadow-dark);
        }

        .coffee-item img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .description {
            font-size: var(--fs-lg);
            font-weight: 500;
            margin: 0 0 2px 12px;
        }

        .price {
            font-size: var(--fs-md);
            font-weight: 700;
            margin: 0 0 2px 12px;
        }

        .pagination-controls {
            margin: 0 9px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-gap {
            width: var(--space-lg);
            min-width: 40px; /* Adjust as needed for your desired gap */
            height: 1px;
        }

        .nav-button {
            background: var(--card-bg);
            border: none;
            padding: var(--space-sm) var(--space-md);
            border-radius: 20px;
            box-shadow: 2px 2px 6px var(--shadow-dark);
            font-size: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 4px 4px 12px var(--shadow-dark);
        }

        .nav-button:disabled {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="coffeeList" class="coffee-list"></div>
        
        <div class="pagination-controls">
            <button id="prevBtn" class="nav-button">Back</button>
            <div class="nav-gap"></div>
            <button id="nextBtn" class="nav-button">Next</button>
        </div>
    </div>

    <script>
        let allCoffeeData = {};
        let currentPage = 1;
        const itemsPerPage = 6;

        document.addEventListener('DOMContentLoaded', () => {
            const coffeeList = document.getElementById('coffeeList');
            
            fetch('../products.json')
                .then(response => response.json())
                .then(data => {
                    allCoffeeData = data;
                    renderCurrentPage();
                    updatePaginationButtons();
                })
                .catch(error => {
                    console.error('Error fetching coffee data:', error);
                });

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderCurrentPage();
                    updatePaginationButtons();
                }
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                const totalPages = Math.ceil(Object.keys(allCoffeeData).length / itemsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderCurrentPage();
                    updatePaginationButtons();
                }
            });
        });

        function renderCurrentPage() {
            const coffeeList = document.getElementById('coffeeList');
            coffeeList.innerHTML = '';
            
            const allKeys = Object.keys(allCoffeeData);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const keysForCurrentPage = allKeys.slice(startIndex, endIndex);

            keysForCurrentPage.forEach(key => {
                const coffee = allCoffeeData[key];
                const coffeeItem = document.createElement('div');
                coffeeItem.classList.add('coffee-item');
                coffeeItem.dataset.index = key;
                
                coffeeItem.addEventListener('click', () => {
                    window.electronAPI.logInput(`${key}`);
                });
                
                const coffeeImage = document.createElement('img');
                coffeeImage.src = coffee.imagePath;
                coffeeImage.alt = coffee.description;
                
                const coffeeDescription = document.createElement('p');
                coffeeDescription.classList.add('description');
                coffeeDescription.textContent = coffee.description;
                
                const coffeePrice = document.createElement('p');
                coffeePrice.classList.add('price');
                coffeePrice.textContent = `Rp. ${coffee.price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".")}`;
                
                coffeeItem.appendChild(coffeeImage);
                coffeeItem.appendChild(coffeeDescription);
                coffeeItem.appendChild(coffeePrice);
                coffeeList.appendChild(coffeeItem);
            });
        }

        function updatePaginationButtons() {
            const totalPages = Math.ceil(Object.keys(allCoffeeData).length / itemsPerPage);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }
    </script>
</body>
</html>

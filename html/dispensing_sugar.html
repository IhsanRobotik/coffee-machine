<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispensing Water</title>
    <style>
        :root {
            --bg-color: #f4f1eb;           /* Warm cream, like milk foam */
            --overlay-color: rgba(139, 115, 85, 0.15); /* Soft coffee overlay */
            --text-color: #3c2415;         /* Dark roasted coffee brown */
            --card-bg: #c08a55;           /* Light coffee with milk */
            --shadow-light: #cba57f;      /* Light coffee shadow */
            --shadow-dark: #4e362f;       /* Dark coffee shadow */
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --font-base: 'Roboto', sans-serif;
            --fs-xl: clamp(1.5rem, 5vw, 2.5rem);
            --fs-lg: clamp(1.25rem, 4vw, 2rem);
            --fs-md: 1rem;
            --line-height: 1.6;
        }

        body {
            font-family: var(--font-base);
            background: linear-gradient(135deg, #2c1810 0%, #8b4513 100%);
            height: 100vh;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            cursor: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: var(--space-lg);
            border-radius: 12px;
            box-shadow: 0 4px 8px var(--shadow-dark), 0 6px 20px var(--shadow-light);
            text-align: center;
        }

        h1 {
            font-size: var(--fs-xl);
            color: var(--text-color);
            margin-bottom: var(--space-md);
            line-height: var(--line-height);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 6px solid var(--overlay-color);
            border-top: 6px solid var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dispensing Sugar</h1>
        <div class="spinner"></div>
    </div>
</body>
</html>

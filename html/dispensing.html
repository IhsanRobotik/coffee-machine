            --fs-md: 1rem;

        }

        body {
            cursor: none;
            font-family: var(--font-base);
            background: linear-gradient(135deg, #2c1810 0%, #8b4513 100%);
            height: 100vh;
            margin: 0;

            -webkit-user-select: none;

        h1 {
            font-size: var(--fs-xl);
            color: var(--text-color);
            margin-bottom: var(--space-md);
            line-height: var(--line-height);
            border: 2px solid rgba(60, 36, 21, 0.3);
            border-radius: 8px;
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 6px solid rgba(139, 115, 85, 0.15);
            border-top: 6px solid var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            box-shadow: 0 0 0 2px rgba(60, 36, 21, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="status">Preparing...</h1>
        <div class="spinner"></div>
    </div>

    <script>
    window.electronAPI.onUpdateStep(step => {
        const capitalized = step.charAt(0).toUpperCase() + step.slice(1);
        document.getElementById('status').textContent = `Dispensing ${capitalized}`;
    });
    </script>
</body>
</html>

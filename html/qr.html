<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
</head>
<body>
    <div class="container">
        <h1>Please scan the QRIS</h1>
        <p id="product-info"></p>
        <div id="qr-placeholder">
            <div class="spinner"></div>
        </div>
        <img id="qr-image" src="" alt="QR Code" style="display: none;">
        <p id="timer">Time remaining: 05:00</p>
        <button id="cancel-button">Cancel Payment</button>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const qrisUrl = urlParams.get('qris_url');
        const description = urlParams.get('description');
        const price = urlParams.get('price');
        const qrImage = document.getElementById('qr-image');
        const qrPlaceholder = document.getElementById('qr-placeholder');

        document.getElementById('product-info').textContent = `Product: ${description}, Price: ${price}`;
        qrImage.src = qrisUrl;

        qrImage.onload = () => {
            qrPlaceholder.style.display = 'none';
            qrImage.style.display = 'block';
        };

        document.getElementById('cancel-button').addEventListener('click', () => {
            window.electronAPI.cancelPayment();
        });

        // Timer logic
        let timeRemaining = 300; // 5 minutes in seconds
        const timerElement = document.getElementById('timer');

        const updateTimer = () => {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerElement.textContent = `Time remaining: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeRemaining > 0) {
                timeRemaining--;
            } else {
                window.electronAPI.cancelPayment();
            }
        };

        setInterval(updateTimer, 1000);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        font-family: 'Roboto', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        
        }

        .container {
        background-image: url('../images/wallpaper.jpg'); /* Correct syntax with url() */
        background-size: cover; /* Ensures the image covers the entire screen */
        padding: 2rem;
        border-radius: 10px;
        text-align: center;
        width: 100vw;
        height: 100vh;
        }

        .container h1 {
        margin-bottom: 0.5rem;
        font-size: 2.5rem; /* Increased font size */
        color: #333;
        }

        #product-info {
        margin-bottom: 1.5rem;
        color: #666;
        font-size: 1.3rem; /* Increased font size */
        }

        #qr-image {
        max-width: 80%;
        height: auto;
        border: 5px solid #f0f0f0;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        display: block;
        margin-left: auto;
        margin-right: auto;
        }

        #cancel-button {
        background: #ff4d4d;
        color: #fff;
        border: none;
        padding: 1rem 2rem; /* Increased padding for a larger button */
        border-radius: 5px;
        font-size: 1.3rem; /* Increased font size */
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
        }

        #cancel-button:hover {
        background: #e60000;
        transform: translateY(-2px);
        }

        #cancel-button:active {
        transform: translateY(0);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #qr-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px; /* Adjust height as needed */
        }
    </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Machine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f5;
            --overlay-color: rgba(255,255,255,0.6);
            --text-color: #333;
            --card-bg: #fff;
            --shadow-light: rgba(255,255,255,0.8);
            --shadow-dark: rgba(0,0,0,0.1);
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --font-base: 'Roboto', sans-serif;
            --fs-xl: clamp(1.7rem, 5.5vw, 2.8rem);
            --fs-lg: clamp(1.4rem, 4.5vw, 2.2rem);
            --fs-md: 1.1rem;
            --line-height: 1.6;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        img {
            user-drag: none;
            -webkit-user-drag: none;
            pointer-events: auto;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .scrollable {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        body {
            font-family: var(--font-base);
            background: linear-gradient(135deg, #2c1810 0%, #8b4513 100%);
            height: 100vh;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            cursor: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .machine-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #f5f5f5, #e8e8e8);
            border-radius: 30px;
            padding: 3vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            height: 80vh;
            margin: auto;
            border: 3px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            margin-bottom: 2vh;
            flex-shrink: 0;
        }

        .title {
            font-size: 2.5rem;
            color: #2c1810;
            font-weight: 700;
            margin-bottom: 1vh;
        }

        .subtitle {
            color: #666;
            font-size: 1.2rem;
        }

        .controls-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            min-height: 0;
        }

        .control-section {
            margin-bottom: 2vh;
        }

        .control-label {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c1810;
            margin-bottom: 1vh;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 28px;
            height: 28px;
            display: inline-block;
        }

        .slider-container {
            position: relative;
            margin: 1.5vh 0;
        }

        .slider {
            width: 100%;
            height: 20px;
            border-radius: 6px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .slider::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 1rem;
            color: #666;
        }

        .value-display {
            text-align: center;
            margin-top: 1vh;
            font-size: 1.3rem;
            font-weight: 600;
            color: #8b4513;
            background: rgba(139, 69, 19, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .sweetness-slider {
            background: linear-gradient(to right, #fff 0%, #ffb3ba 50%, #ff69b4 100%);
        }

        .strength-slider {
            background: linear-gradient(to right, #f4e4bc 0%, #8b4513 50%, #2c1810 100%);
        }

        .brew-section {
            flex-shrink: 0;
            margin-top: 2vh;
        }

        .button-row {
            display: flex;
            gap: 1px;
            align-items: center;
        }

        .back-button {
            flex: 1;
            padding: 2.5vh;
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(45deg, #666, #999);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(102, 102, 102, 0.3);
            touch-action: manipulation;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 102, 102, 0.4);
        }

        .back-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(102, 102, 102, 0.3);
        }

        .brew-button {
            flex: 2;
            padding: 2.5vh;
            font-size: 1.6rem;
            max-width: 230px;
            font-weight: 700;
            color: white;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(139, 69, 19, 0.3);
            touch-action: manipulation;
        }

        .brew-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 69, 19, 0.4);
        }

        .brew-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .status-message {
            text-align: center;
            margin-top: 1vh;
            font-size: 1.3rem;
            font-weight: 600;
            color: #4CAF50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-message.show {
            opacity: 1;
        }

        .container {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: var(--space-lg);
            padding: var(--space-lg);
            width: 90%;
            max-width: 1200px;
            background: var(--overlay-color);
            backdrop-filter: blur(6px);
            border-radius: 16px;
        }

        .coffee-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-lg);
        }

        .coffee-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: var(--space-md);
            box-shadow:
                inset 4px 4px 8px var(--shadow-light),
                4px 4px 8px var(--shadow-dark);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .coffee-item:hover {
            transform: translateY(-4px);
            box-shadow:
                inset 2px 2px 4px var(--shadow-light),
                8px 8px 16px var(--shadow-dark);
        }

        .coffee-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: var(--space-sm);
        }

        .description {
            font-size: var(--fs-lg);
            font-weight: 500;
            margin: var(--space-sm) 0;
        }

        .price {
            font-size: var(--fs-md);
            font-weight: 700;
        }

        .swipe-indicator {
            position: fixed;
            bottom: var(--space-lg);
            right: var(--space-lg);
            background: var(--card-bg);
            padding: var(--space-sm) var(--space-md);
            border-radius: 20px;
            box-shadow: 2px 2px 6px var(--shadow-dark);
            pointer-events: none;
        }

        .swipe-text {
            font-size: var(--fs-lg);
        }

        .finger-animation {
            font-size: 1.5rem;
            animation: swipeLeft 2.5s infinite;
            transform-origin: center right;
        }

        @keyframes swipeLeft {
            0%   { transform: translateX(40px); opacity: 0; }
            20%,80% { opacity: 1; }
            100% { transform: translateX(-20px); opacity: 0; }
        }

        /* Touch-friendly adjustments */
        @media (max-width: 500px) {
            .machine-container {
                padding: 2vh;
                border-radius: 20px;
                width: 95%;
                height: 96vh;
                margin: 2vh auto;
            }
            
            .title {
                font-size: 2.1rem;
            }
            
            .control-label {
                font-size: 1.3rem;
            }
            
            .slider::-webkit-slider-thumb {
                width: 36px;
                height: 36px;
            }
            
            .brew-button {
                padding: 2vh;
                font-size: 1.4rem;
            }
            
            .back-button {
                font-size: 1.4rem;
            }
            
            .value-display {
                font-size: 1.2rem;
            }
        }

        @media (max-height: 700px) {
            .title {
                font-size: 2.1rem;
                margin-bottom: 0.5vh;
            }
            
            .control-label {
                font-size: 1.3rem;
            }
            
            .value-display {
                font-size: 1.2rem;
                padding: 6px 12px;
            }
            
            .brew-button {
                font-size: 1.4rem;
                padding: 2vh;
            }
            
            .back-button {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="machine-container">
        <div class="header">
            <div id="coffee-name" style="text-align:center; font-size:2.3rem; font-weight: bold; color:#8b4513; margin-bottom:1vh;"></div>
        </div>

        <div class="controls-wrapper">
            <div class="control-section">
                <div class="control-label">
                    <img src="../images/sugar (1).png" alt="Honey" class="icon">
                    <span>Sweetness Level</span>
                </div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="30" class="slider sweetness-slider" id="sweetness">
                    <div class="slider-labels">
                        <span>None</span>
                        <span>Light</span>
                        <span>Medium</span>
                        <span>Sweet</span>
                    </div>
                </div>
                <div class="value-display" id="sweetness-value">Light Sweet</div>
            </div>

            <div class="control-section">
                <div class="control-label">
                    <img src="../images/coffee-beans.png" alt="Strong" class="icon">
                    <span>Coffee Strength</span>
                </div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="60" class="slider strength-slider" id="strength">
                    <div class="slider-labels">
                        <span>Mild</span>
                        <span>Medium</span>
                        <span>Strong</span>
                        <span>Extra</span>
                    </div>
                </div>
                <div class="value-display" id="strength-value">Medium Strong</div>
            </div>
        </div>

        <div class="brew-section">
            <div class="button-row">
                <button class="back-button" id="back-btn">
                    BACK
                </button>
                <button class="brew-button" id="brew-btn">
                    BREW
                </button>
            </div>
        </div>
    </div>

    <script>
        const sweetness = document.getElementById('sweetness');
        const strength = document.getElementById('strength');
        const sweetnessValue = document.getElementById('sweetness-value');
        const strengthValue = document.getElementById('strength-value');
        const brewBtn = document.getElementById('brew-btn');
        const status = document.getElementById('status');

        document.getElementById('back-btn').addEventListener('click', function() {
            window.electronAPI.send('exit-application');
        });

        document.getElementById('brew-btn').addEventListener('click', function() {
        const values = {
            sweetness: document.getElementById('sweetness').value,
            strength: document.getElementById('strength').value
        };
        window.electronAPI.send('adjust-preference', values);
        });

        window.electronAPI.receive('set-coffee-name', (coffeeName) => {
            document.getElementById('coffee-name').textContent = coffeeName;
        });

        function getSweetnessLabel(value) {
            if (value <= 10) return 'No Sugar';
            if (value <= 35) return 'Light Sweet';
            if (value <= 65) return 'Medium Sweet';
            if (value <= 85) return 'Sweet';
            return 'Extra Sweet';
        }

        function getStrengthLabel(value) {
            if (value <= 25) return 'Mild';
            if (value <= 50) return 'Medium';
            if (value <= 75) return 'Strong';
            return 'Extra Strong';
        }

        sweetness.addEventListener('input', (e) => {
            sweetnessValue.textContent = getSweetnessLabel(e.target.value);
        });

        strength.addEventListener('input', (e) => {
            strengthValue.textContent = getStrengthLabel(e.target.value);
        });

        // Prevent zoom on double tap for better touch experience
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>

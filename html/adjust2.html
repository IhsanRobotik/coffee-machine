<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #8b4513 100%);
            height: 100vh;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .machine-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #f5f5f5, #e8e8e8);
            border-radius: 30px;
            padding: 3vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 90%;
            height: 94vh;
            margin: auto;
            border: 3px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            margin-bottom: 2vh;
            flex-shrink: 0;
        }

        .title {
            font-size: 2.2rem;
            color: #2c1810;
            font-weight: 700;
            margin-bottom: 1vh;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .controls-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            min-height: 0;
        }

        .control-section {
            margin-bottom: 2vh;
        }

        .control-label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c1810;
            margin-bottom: 1vh;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.5rem;
        }

        .slider-container {
            position: relative;
            margin: 1.5vh 0;
        }

        .slider {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .slider::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .value-display {
            text-align: center;
            margin-top: 1vh;
            font-size: 1.1rem;
            font-weight: 600;
            color: #8b4513;
            background: rgba(139, 69, 19, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .sweetness-slider {
            background: linear-gradient(to right, #fff 0%, #ffb3ba 50%, #ff69b4 100%);
        }

        .strength-slider {
            background: linear-gradient(to right, #f4e4bc 0%, #8b4513 50%, #2c1810 100%);
        }

        .creamer-slider {
            background: linear-gradient(to right, #2c1810 0%, #d2b48c 50%, #fff 100%);
        }

        .brew-section {
            flex-shrink: 0;
            margin-top: 2vh;
        }

        .brew-button {
            width: 100%;
            padding: 2.5vh;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(139, 69, 19, 0.3);
            touch-action: manipulation;
        }

        .brew-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 69, 19, 0.4);
        }

        .brew-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .brewing {
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .status-message {
            text-align: center;
            margin-top: 1vh;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4CAF50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-message.show {
            opacity: 1;
        }

        /* Touch-friendly adjustments */
        @media (max-width: 500px) {
            .machine-container {
                padding: 2vh;
                border-radius: 20px;
                width: 95%;
                height: 96vh;
                margin: 2vh auto;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .control-label {
                font-size: 1.2rem;
            }
            
            .slider::-webkit-slider-thumb {
                width: 36px;
                height: 36px;
            }
            
            .brew-button {
                padding: 2vh;
                font-size: 1.3rem;
            }
        }

        @media (max-height: 700px) {
            .title {
                font-size: 1.8rem;
                margin-bottom: 0.5vh;
            }
            
            .control-label {
                font-size: 1.1rem;
            }
            
            .value-display {
                font-size: 1rem;
                padding: 6px 12px;
            }
            
            .brew-button {
                font-size: 1.2rem;
                padding: 2vh;
            }
        }
    </style>
</head>
<body>
    <div class="machine-container">
        <div class="header">
            <h1 class="title">☕ Coffee Master</h1>
            <p class="subtitle">Craft your perfect cup</p>
        </div>

        <div class="controls-wrapper">
            <div class="control-section">
                <div class="control-label">
                    <span class="icon">🍯</span>
                    <span>Sweetness Level</span>
                </div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="30" class="slider sweetness-slider" id="sweetness">
                    <div class="slider-labels">
                        <span>None</span>
                        <span>Light</span>
                        <span>Medium</span>
                        <span>Sweet</span>
                    </div>
                </div>
                <div class="value-display" id="sweetness-value">Light Sweet</div>
            </div>

            <div class="control-section">
                <div class="control-label">
                    <span class="icon">💪</span>
                    <span>Coffee Strength</span>
                </div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="60" class="slider strength-slider" id="strength">
                    <div class="slider-labels">
                        <span>Mild</span>
                        <span>Medium</span>
                        <span>Strong</span>
                        <span>Extra</span>
                    </div>
                </div>
                <div class="value-display" id="strength-value">Medium Strong</div>
            </div>

            <div class="control-section">
                <div class="control-label">
                    <span class="icon">🥛</span>
                    <span>Creamer Amount</span>
                </div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="40" class="slider creamer-slider" id="creamer">
                    <div class="slider-labels">
                        <span>Black</span>
                        <span>Splash</span>
                        <span>Regular</span>
                        <span>Creamy</span>
                    </div>
                </div>
                <div class="value-display" id="creamer-value">Regular Cream</div>
            </div>
        </div>

        <div class="brew-section">
            <button class="brew-button" id="brew-btn">
                ☕ BREW MY COFFEE
            </button>

            <div class="status-message" id="status">
                Brewing your perfect cup... ☕
            </div>
        </div>
    </div>

    <script>
        const sweetness = document.getElementById('sweetness');
        const strength = document.getElementById('strength');
        const creamer = document.getElementById('creamer');
        const sweetnessValue = document.getElementById('sweetness-value');
        const strengthValue = document.getElementById('strength-value');
        const creamerValue = document.getElementById('creamer-value');
        const brewBtn = document.getElementById('brew-btn');
        const status = document.getElementById('status');

        function getSweetnessLabel(value) {
            if (value <= 10) return 'No Sugar';
            if (value <= 35) return 'Light Sweet';
            if (value <= 65) return 'Medium Sweet';
            if (value <= 85) return 'Sweet';
            return 'Extra Sweet';
        }

        function getStrengthLabel(value) {
            if (value <= 25) return 'Mild';
            if (value <= 50) return 'Medium';
            if (value <= 75) return 'Strong';
            return 'Extra Strong';
        }

        function getCreamerLabel(value) {
            if (value <= 15) return 'Black Coffee';
            if (value <= 40) return 'Light Cream';
            if (value <= 65) return 'Regular Cream';
            if (value <= 85) return 'Extra Creamy';
            return 'Very Creamy';
        }

        sweetness.addEventListener('input', (e) => {
            sweetnessValue.textContent = getSweetnessLabel(e.target.value);
        });

        strength.addEventListener('input', (e) => {
            strengthValue.textContent = getStrengthLabel(e.target.value);
        });

        creamer.addEventListener('input', (e) => {
            creamerValue.textContent = getCreamerLabel(e.target.value);
        });

        brewBtn.addEventListener('click', () => {
            brewBtn.classList.add('brewing');
            brewBtn.textContent = '☕ BREWING...';
            status.classList.add('show');
            
            setTimeout(() => {
                brewBtn.classList.remove('brewing');
                brewBtn.textContent = '✅ COFFEE READY!';
                status.textContent = 'Your perfect coffee is ready! Enjoy! ☕';
                
                setTimeout(() => {
                    brewBtn.textContent = '☕ BREW MY COFFEE';
                    status.classList.remove('show');
                    status.textContent = 'Brewing your perfect cup... ☕';
                }, 3000);
            }, 3000);
        });

        // Prevent zoom on double tap for better touch experience
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
